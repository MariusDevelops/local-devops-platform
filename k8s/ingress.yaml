apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
spec:
  ingressClassName: nginx
  rules:
  - host: app.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: frontend, port: { number: 80 } }
  - host: api.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: backend, port: { number: 8000 } }